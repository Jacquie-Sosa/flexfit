      <div class="info-cuenta">
        <h1>Crea tu Cuenta</h1>
        <h4>Unete a Flexfit!</h4>
      </div>
    </section>

    <section id="formu">
      <div class="formulario">
        <form action="index.html" method="get">
          <label for="nombre">Nombre:</label>
          <input type="text" name="nombre" placeholder="Nombre" required>

          <label for="nombre">Apellos:</label>
          <input type="text" name="apellido" placeholder="Apellido" required>

          <label for="nombre">Contraseña:</label>
          <input type="email" name="contraseña" placeholder="Contraseña" required>

          <label for="nombre">DNI:</label>
          <input type="text" name="DNI" placeholder="DNI" required>

          <label for="nombre">Numero de tarjeta:</label>
          <input type="text" name="tarjeta" placeholder="Num. tarjeta credito/debito" required>

          <label for="nombre">Fecha de vencimiento:</label>
          <input type="text" name="Fecha" placeholder="fecha de vencimiento" required>

          <label for="nombre">CV:</label>
          <input type="text" name="CV" placeholder="CV" required>

          <label for="nombre">Nombre en tarjeta:</label>
          <input type="text" name="name" placeholder="Nombre de tarjeta" required>

          <a href="/" class="enviar-inicio">
            <button type="submit">Enviar solicitud</button>
          </a>
        </form>
      </div>
    </section>

    <section id="gugul">
      <div class="redes">
        <div class="grid grid-cols-2">
